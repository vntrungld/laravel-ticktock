name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.0'
            laravel: '5.5.*'
            testbench: '3.5.*'
          - php: '7.1'
            laravel: '5.6.*'
            testbench: '3.6.*'
          - php: '7.1'
            laravel: '5.7.*'
            testbench: '3.7.*'
          - php: '7.1'
            laravel: '5.8.*'
            testbench: '3.8.*'
          - php: '7.4'
            laravel: '6.*'
            testbench: '4.*'
          - php: '7.4'
            laravel: '7.*'
            testbench: '5.*'
          - php: '8.0'
            laravel: '8.*'
            testbench: '6.*'
          - php: '8.1'
            laravel: '9.*'
            testbench: '7.*'
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
          - php: '8.5'
            laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      # Old Laravel releases have security advisories and Carbon 1.x ships a
      # Composer plugin; both block installs on recent Composer versions.
      # Composer 2.2 (used on PHP 7.x) has no audit.block-insecure setting.
      - name: Configure Composer
        run: |
          composer config --no-plugins allow-plugins.kylekatarnls/update-helper false
          composer config audit.block-insecure false || true

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
